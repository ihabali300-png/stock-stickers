<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استيكرات ترتيب الستوك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#eef0f3;--ink:#16181d;--mut:#6b7280;--line:#d9dde3;--acc:#0f766e;--acc2:#e6f4f2;--warn:#b45309;--danger:#b91c1c;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;padding:8px 12px 4px}
.brand h1{font-size:16px;margin:0;font-weight:800}
.status{margin-inline-start:auto;font-size:12px;color:var(--mut);background:#f3f4f6;border-radius:99px;padding:2px 10px;white-space:nowrap}
.status.ok{color:var(--acc);background:var(--acc2)}
.status.warn{color:var(--warn);background:#fef3c7}
.nav{padding:4px 10px 2px}
.srch{position:relative;padding:2px 10px 6px}
.srch input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;font-size:15px;background:#f8fafc}
.srch input:focus{outline:none;border-color:var(--acc);background:#fff}
.sres{position:absolute;left:10px;right:10px;top:100%;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.15);max-height:55vh;overflow:auto;z-index:30;display:none}
.sres.on{display:block}
.sr{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #f1f5f9;cursor:pointer}
.sr:hover,.sr.act{background:var(--acc2)}
.sr img{width:46px;height:28px;object-fit:contain}
.sr .m{font-family:Arial,Helvetica,sans-serif;font-weight:800;font-size:15px;direction:ltr}
.sr .w{font-size:12px;color:var(--mut);margin-inline-start:auto;text-align:left;direction:ltr}
.sr .k{font-size:11px;color:var(--mut);direction:ltr}
.blk td.hit{animation:hit 1.6s ease 2}
@keyframes hit{0%,100%{background:#fff}50%{background:#fde68a}}
.mrow{display:flex;gap:8px}
.mt{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:6px 6px 5px;display:flex;flex-direction:column;align-items:center;line-height:1.2;max-width:220px}
.mt b{font-size:18px;font-family:Arial,Helvetica,sans-serif;letter-spacing:.5px}
.mt small{font-size:11px;color:var(--mut);font-weight:600}
.mt.on{background:var(--ink);border-color:var(--ink);color:#fff}
.mt.on small{color:#cbd5e1}
.srow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.st{border:1px solid var(--line);background:#f8fafc;border-radius:99px;padding:4px 14px;font-size:13.5px;font-weight:700;font-family:Arial,Helvetica,sans-serif}
.st .cnt{font-size:11px;color:var(--mut);font-weight:600;margin:0 6px}
.st.on{background:var(--acc);border-color:var(--acc);color:#fff}
.st.on .cnt{color:#ccfbf1}
.prow{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.prow .lbl{font-size:12px;color:var(--mut);font-weight:700}
.pg{min-width:34px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:3px 9px;font-size:13px;font-weight:700}
.pg.on{background:var(--acc2);border-color:var(--acc);color:var(--acc)}
.pg.add{color:var(--acc)}
.tools{display:flex;gap:6px;overflow-x:auto;padding:4px 10px 8px;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tb{flex:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.tb.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.stage{padding:12px 8px 140px}
.warnbar{max-width:900px;margin:0 auto 8px;background:#fef3c7;color:#7c2d12;border-radius:10px;padding:6px 12px;font-size:13px;display:none}
.pagewrap{margin:0 auto;position:relative}
.page{position:absolute;top:0;right:auto;left:0;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.12);transform-origin:0 0;direction:ltr;overflow:hidden}
.cut{position:absolute;inset:0;pointer-events:none}
.blk{position:absolute;border-collapse:collapse;table-layout:fixed;border:2px solid #000;background:#fff;cursor:pointer}
.blk td{border:1.2px solid #000;padding:0;text-align:center;vertical-align:middle;overflow:hidden;font-family:Arial,Helvetica,sans-serif;font-weight:700;line-height:1}
.blk tr.hd td{border-bottom:2px solid #000}
.blk.sel{outline:3px solid #14b8a6;outline-offset:3px}
.blk tr.rsel td{background:#ccfbf1}
.blk .noqr{color:#dc2626;font-family:Cairo;font-size:13px}
.blk .ph{opacity:.25;font-size:26px}
.blk img{display:block;margin:auto;object-fit:contain}
.blk svg{display:block;margin:auto}
.ghost{position:absolute;border:2px dashed #cbd5e1;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-family:Cairo;font-size:14px;cursor:pointer}
.hint{max-width:900px;margin:10px auto 0;text-align:center;color:var(--mut);font-size:13px}
/* sheet */
.sheet{position:fixed;inset:auto 0 0 0;z-index:40;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.18);max-height:58vh;overflow:auto;transform:translateY(105%);transition:transform .2s}
body.shopen .stage{padding-bottom:62vh}
@media (min-width:900px){
 .sheet{inset:0 auto 0 0;width:380px;max-height:none;border-radius:0;box-shadow:6px 0 30px rgba(0,0,0,.12);transform:translateX(-105%)}
 body.shopen .stage{padding-bottom:140px;margin-left:380px}
 body.shopen .top{margin-left:380px}
}
.sheet.open{transform:none}
.sheet .hdr{position:sticky;top:0;background:#fff;display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);z-index:2}
.sheet .hdr b{font-size:15px}
.x{margin-inline-start:auto;border:none;background:#f3f4f6;border-radius:99px;width:32px;height:32px;font-size:16px}
.sb{padding:12px 14px 18px}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:3px;font-weight:600}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.ltr{direction:ltr;text-align:left}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.fld{flex:1;min-width:110px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-size:13.5px;font-weight:700}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.dan{color:var(--danger);border-color:#fecaca}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grp{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px}
.grp h4{margin:0 0 8px;font-size:13px;color:var(--mut)}
.thumb{width:84px;height:60px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fafafa}
.thumb img{max-width:100%;max-height:100%}
.colrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.colrow select,.colrow input{border:1px solid var(--line);border-radius:8px;padding:6px;font-size:14px}
.colrow input{width:70px}
.small{font-size:12px;color:var(--mut)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.mbox{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:88vh;overflow:auto}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 16px;border-radius:99px;font-size:13.5px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
table.prev{border-collapse:collapse;font-size:12px;direction:ltr;width:100%}
table.prev td,table.prev th{border:1px solid var(--line);padding:3px 5px;white-space:nowrap}
#printRoot{display:none}
@media print{
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block}
  html,body{background:#fff!important;margin:0!important;padding:0!important}
  #printRoot .page{position:relative;box-shadow:none;transform:none!important;page-break-after:always;break-after:page;margin:0}
  #printRoot .page:last-child{page-break-after:auto;break-after:auto}
  .blk td,.blk tr.hd td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .blk.sel{outline:none}
  .blk tr.rsel td{background:none}
}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><h1>استيكرات ترتيب الستوك 🕶️</h1><span id="status" class="status">جاري التحميل…</span></div>
  <div class="srch"><input type="search" id="q" placeholder="ابحث برقم الموديل أو الكود…" autocomplete="off" inputmode="search"><div class="sres" id="qres"></div></div>
  <div class="nav" id="tabs"></div>
  <div class="tools">
    <button class="tb pri" id="bPdf">طباعة 🖨️</button>
    <button class="tb" id="bSort">ترتيب وفلترة ↕️</button>
    <button class="tb" id="bNew">موديل وصل جديد R ➕</button>
    <button class="tb" id="bSet">إعدادات الصفحة ⚙️</button>
    <button class="tb" id="bMore">المزيد ⋯</button>
  </div>
</div>
<div class="stage" id="stage">
  <div class="warnbar" id="warn"></div>
  <div class="pagewrap" id="wrap"></div>
  <div class="hint">اضغط على أي مربع أو صف عشان تعدّله</div>
</div>
<div class="sheet" id="sheet"><div class="hdr"><b id="shT"></b><button class="x" id="shX">✕</button></div><div class="sb" id="shB"></div></div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fImg" accept="image/*" hidden>
<input type="file" id="fImgs" accept="image/*" multiple hidden>
<input type="file" id="fSheet" accept=".csv,.tsv,.txt,.xlsx,.xls" hidden>
<input type="file" id="fJson" accept=".json,application/json" hidden>
<div id="printRoot"></div>
<style id="pageStyle"></style>

<script>
const K = 96/25.4, PT = 96/72, LS = 'stk_state_v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const ncmp = (a, b) => String(a).localeCompare(String(b), 'en', {numeric: true, sensitivity: 'base'});
if (window.qrcode && qrcode.stringToBytesFuncs) qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];

let S, cur = 0, sel = null, ART = null, DL = null, canPublish = true;

/* ---------- model ---------- */
function defTab(name) {
  return {id: uid(), name: name || 'صفحة جديدة', orient: 'l', margin: 8, cols: 3, rows: 2, gapX: 12, gapY: 12,
    colW: [24, 24, 24], colT: ['text', 'qr', 'image'], headH: 8, rowH: 21.5, headFs: 13, textFs: 15, pad: 1.8, cut: true, blocks: []};
}
function emptyBlock(tab, n) {
  n = n ?? 3;
  return {head: tab.colT.map(() => ''), late: false, hidden: false, items: Array.from({length: n}, () => ({t: tab.colT.map(() => '')}))};
}
function ensureBlocks(tab) { const need = tab.cols * tab.rows; while (tab.blocks.length < need) tab.blocks.push(emptyBlock(tab)); }
function demo() {
  const t = defTab('30S MEN');
  const data = [['1', ['207', '234', '241']], ['2', ['247', '251', '277']], ['3', ['303', '410', '416']], ['4', ['408', '442', '502']], ['5', ['448', '516', '217'], true]];
  t.blocks = data.map(([n, ms, late]) => ({head: ['30S', n, 'MEN'], late: !!late, hidden: false, items: ms.map(m => ({t: [m, '', '']}))}));
  ensureBlocks(t);
  return {v: 1, updated: 0, qrTpl: '{model}', tabs: [t], images: {}};
}
const T = () => S.tabs[cur];
const textCol = tab => tab.colT.indexOf('text');
const rowModel = (tab, it) => { const i = textCol(tab); return i < 0 ? '' : String(it.t[i] || '').trim(); };
const lateIdx = tab => Math.min(1, tab.colT.length - 1);
function headText(tab, b, c) { let s = b.head[c] || ''; if (b.late && c === lateIdx(tab)) s = (s + ' R').trim(); return s; }
function skuFor(m) { if (!m || !S.skus) return ''; if (S.skus[m]) return S.skus[m]; const n = String(parseInt(m, 10)); return /^\d/.test(m) && S.skus[n] ? S.skus[n] : ''; }
function qrFromSku(k) { return k; }
function qrValue(tab, it, c) { if (it.t[c]) return it.t[c]; const m = rowModel(tab, it); if (!m) return ''; const k = skuFor(m); if (k) return qrFromSku(k); return S.qrTpl === '{model}' && S.skus && Object.keys(S.skus).length ? '' : S.qrTpl.replace(/\{model\}/g, m); }
function findImg(key) { if (!key) return null; if (S.images[key]) return S.images[key]; const k = String(key).toLowerCase(); for (const n in S.images) if (n.toLowerCase() === k) return S.images[n]; return null; }
function imgFor(tab, it, c) { return findImg(it.t[c]) || findImg(rowModel(tab, it)); }
function blockEmpty(b) { return !b.head.some(x => String(x).trim()) && !b.items.some(it => it.t.some(x => String(x).trim())); }

function layout(tab) {
  const W = tab.orient === 'l' ? 297 : 210, H = tab.orient === 'l' ? 210 : 297;
  const bw = tab.colW.reduce((a, b) => a + (+b || 0), 0);
  const bh = b => tab.headH + b.items.length * tab.rowH;
  const rowsH = [];
  for (let r = 0; r < tab.rows; r++) { let m = 0; for (let c = 0; c < tab.cols; c++) { const b = tab.blocks[r * tab.cols + c]; if (b) m = Math.max(m, bh(b)); } rowsH.push(m); }
  const totW = tab.cols * bw + (tab.cols - 1) * tab.gapX, totH = rowsH.reduce((a, b) => a + b, 0) + (tab.rows - 1) * tab.gapY;
  const x0 = Math.max(tab.margin, (W - totW) / 2), y0 = Math.max(tab.margin, (H - totH) / 2);
  const boxes = [];
  for (let i = 0; i < tab.cols * tab.rows; i++) {
    const c = i % tab.cols, r = Math.floor(i / tab.cols), b = tab.blocks[i];
    let y = y0 + r * tab.gapY; for (let k = 0; k < r; k++) y += rowsH[k];
    boxes.push({x: x0 + c * (bw + tab.gapX), y, w: bw, h: bh(b)});
  }
  const over = totW > W - 2 * tab.margin + 0.05 || totH > H - 2 * tab.margin + 0.05;
  return {W, H, bw, boxes, over, totW, totH};
}

/* ---------- QR ---------- */
const qrCache = new Map();
function qrMods(text) {
  if (!text || !window.qrcode) return null;
  if (qrCache.has(text)) return qrCache.get(text);
  let res = null;
  try { const q = qrcode(0, 'M'); q.addData(text); q.make(); const n = q.getModuleCount(); const g = []; for (let r = 0; r < n; r++) { const row = []; for (let c = 0; c < n; c++) row.push(q.isDark(r, c)); g.push(row); } res = {n, g}; } catch (e) { res = null; }
  qrCache.set(text, res); return res;
}
function qrSvg(text, sizePx) {
  const m = qrMods(text); if (!m) return '';
  let d = '';
  m.g.forEach((row, r) => { let c = 0; while (c < m.n) { if (row[c]) { let e = c; while (e < m.n && row[e]) e++; d += `M${c} ${r}h${e - c}v1h-${e - c}z`; c = e; } else c++; } });
  return `<svg width="${sizePx}" height="${sizePx}" viewBox="0 0 ${m.n} ${m.n}" shape-rendering="crispEdges"><path d="${d}" fill="#000"/></svg>`;
}

/* ---------- render ---------- */
const px = v => (v * K).toFixed(2) + 'px';
function cellHTML(tab, it, c, live) {
  const t = tab.colT[c], w = tab.colW[c], h = tab.rowH, p = tab.pad;
  if (t === 'text') return `<span style="font-size:${(tab.textFs * PT).toFixed(1)}px">${esc(it.t[c])}</span>`;
  if (t === 'qr') { const s = Math.max(4, Math.min(w, h) - 2 * p), v = qrValue(tab, it, c); if (!v) return live && rowModel(tab, it) ? '<span class="noqr">QR؟</span>' : ''; return qrSvg(v, (s * K).toFixed(1)); }
  if (t === 'image') { const im = imgFor(tab, it, c); if (im) return `<img src="${im.d}" style="max-width:${px(w - 2 * p)};max-height:${px(h - 2 * p)}">`; return live && rowModel(tab, it) ? '<span class="ph">🕶️</span>' : ''; }
  return '';
}
function pageHTML(tab, live) {
  ensureBlocks(tab);
  const L = layout(tab);
  let s = `<div class="page" style="width:${px(L.W)};height:${px(L.H)}">`;
  if (tab.cut) {
    const xs = new Set(), ys = new Set();
    L.boxes.forEach((b, i) => { if (tab.blocks[i].hidden) return; xs.add(+b.x.toFixed(2)); xs.add(+(b.x + b.w).toFixed(2)); ys.add(+b.y.toFixed(2)); ys.add(+(b.y + b.h).toFixed(2)); });
    const e = 3;
    s += `<svg class="cut" viewBox="0 0 ${L.W} ${L.H}" preserveAspectRatio="none">` +
      [...xs].map(x => `<line x1="${x}" y1="${e}" x2="${x}" y2="${L.H - e}"/>`).join('') +
      [...ys].map(y => `<line x1="${e}" y1="${y}" x2="${L.W - e}" y2="${y}"/>`).join('') +
      `<style>line{stroke:#c8c8c8;stroke-width:.2}</style></svg>`;
  }
  L.boxes.forEach((bx, i) => {
    const b = tab.blocks[i];
    if (b.hidden) { if (live) s += `<div class="ghost" data-b="${i}" style="left:${px(bx.x)};top:${px(bx.y)};width:${px(bx.w)};height:${px(bx.h)}">مربع مخفي — اضغط لإظهاره</div>`; return; }
    const isSel = live && sel && sel.b === i;
    s += `<table class="blk ${isSel ? 'sel' : ''}" data-b="${i}" style="left:${px(bx.x)};top:${px(bx.y)};width:${px(L.bw)}"><colgroup>` +
      tab.colW.map(w => `<col style="width:${px(w)}">`).join('') + '</colgroup>';
    s += `<tr class="hd ${isSel && sel.r === -1 ? 'rsel' : ''}" data-r="-1" style="height:${px(tab.headH)}">` +
      tab.colT.map((t, c) => `<td style="font-size:${(tab.headFs * PT).toFixed(1)}px">${esc(headText(tab, b, c))}</td>`).join('') + '</tr>';
    b.items.forEach((it, r) => {
      s += `<tr data-r="${r}" class="${isSel && sel.r === r ? 'rsel' : ''}" style="height:${px(tab.rowH)}">` + tab.colT.map((t, c) => `<td>${cellHTML(tab, it, c, live)}</td>`).join('') + '</tr>';
    });
    s += '</table>';
  });
  return s + '</div>';
}
const COL_ORDER = ['30S', 'BLC', 'OC'], GEN_ORDER = ['UNISEX', 'MEN', 'WOMEN'];
const COL_NAME = {'30S': 'ثرتي سن ديز', 'BLC': 'بلاك أوت', 'OC': 'أوبتيكال كلوب'};
const rank = (arr, x) => { const i = arr.indexOf(x); return i < 0 ? 99 : i; };
function normGen(g) { g = String(g || '').toUpperCase().trim(); if (/^UN/.test(g)) return 'UNISEX'; if (/^WOM/.test(g)) return 'WOMEN'; if (/^MEN/.test(g)) return 'MEN'; return g; }
function migrate(t) {
  if (t.col == null) { const b = t.blocks.find(b => b.head.some(x => String(x).trim())); t.col = b ? String(b.head[0]).toUpperCase().trim() : ''; t.gen = b ? normGen(b.head[b.head.length - 1]) : ''; }
  t.col = String(t.col || '').trim() || 'أخرى'; t.gen = normGen(t.gen) || 'عام';
}
function colList() { return [...new Set(S.tabs.map(t => t.col))].sort((a, b) => rank(COL_ORDER, a) - rank(COL_ORDER, b) || ncmp(a, b)); }
function genList(col) { return [...new Set(S.tabs.filter(t => t.col === col).map(t => t.gen))].sort((a, b) => rank(GEN_ORDER, a) - rank(GEN_ORDER, b) || ncmp(a, b)); }
function pagesOf(col, gen) { return S.tabs.map((t, i) => i).filter(i => S.tabs[i].col === col && S.tabs[i].gen === gen); }
function pageNo(i) { const t = S.tabs[i]; return pagesOf(t.col, t.gen).indexOf(i) + 1; }
function tabLabel(t) { const i = S.tabs.indexOf(t), n = pagesOf(t.col, t.gen).length; return `${t.col} ${t.gen}` + (n > 1 ? ` ${pageNo(i)}` : ''); }
function countModels(idxs) { let n = 0; idxs.forEach(i => { const t = S.tabs[i]; t.blocks.forEach(b => { if (!b.hidden) b.items.forEach(it => { if (rowModel(t, it)) n++; }); }); }); return n; }
function renderTabs() {
  const t = T(), pages = pagesOf(t.col, t.gen);

function parseDelim(text) {
  const d = text.indexOf('\t') >= 0 ? '\t' : (text.split('\n')[0].split(';').length > text.split('\n')[0].split(',').length ? ';' : ',');

    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"' && f === '') q = true;
    else if (ch === d) { row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += ch;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }

}

  const m = modal(`<div class="sb"><b>استيراد من جوجل شيت</b>
   <p class="small" style="font-size:13.5px">انسخ الجدول من الشيت (مع صف العناوين) والصقه هنا، أو ارفع ملف CSV / Excel (من جوجل شيت: ملف ← تنزيل).</p>
   <div class="fld"><textarea id="impT" rows="5" class="ltr" placeholder="Collection	Gender	Model	..."></textarea></div>
   <div class="row"><button class="btn" id="impF">رفع ملف 📄</button><button class="btn pri" id="impGo">التالي</button><button class="btn" id="impX">إلغاء</button></div></div>`);
  m.querySelector('#impX').onclick = closeModal;
  m.querySelector('#impF').onclick = () => { $('#fSheet').value = ''; $('#fSheet').click(); };
  m.querySelector('#impGo').onclick = () => { const r = parseDelim(m.querySelector('#impT').value); if (r.length < 2) return toast('محتاج صف عناوين + بيانات'); mapStep(r); };
}
$('#fSheet').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    let rows;
    if (/\.xlsx?$/i.test(f.name)) {
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
      const wb = XLSX.read(await f.arrayBuffer(), {type: 'array'});
      if (wb.SheetNames.length > 1) {
        const name = await new Promise(res => { const m = modal(`<div class="sb"><b>اختار الشيت</b><div class="row" style="margin-top:10px;flex-direction:column;align-items:stretch">${wb.SheetNames.map(n => `<button class="btn" data-n="${esc(n)}" style="direction:ltr">${esc(n)}</button>`).join('')}</div></div>`); m.onclick = ev => { const n = ev.target.dataset.n; if (n) { res(n); } }; });
        rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header: 1, raw: false, defval: ''});
      } else rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1, raw: false, defval: ''});
      rows = rows.filter(r => r.some(c => String(c).trim()));
    } else rows = parseDelim(await f.text());
    if (rows.length < 2) return toast('الملف فاضي');
    mapStep(rows);
  } catch (er) { toast('مقدرتش أقرا الملف'); }
};
function guess(heads, words) { const i = heads.findIndex(h => words.some(w => String(h).toLowerCase().includes(w))); return i; }
function mapStep(rows) {
  const heads = rows[0].map(String), data = rows.slice(1);
  IMP = {heads, data};
  const opt = (sel) => `<option value="-1">— مش موجود —</option>` + heads.map((h, i) => `<option value="${i}" ${i === sel ? 'selected' : ''}>${esc(h || ('عمود ' + (i + 1)))}</option>`).join('');
  const gC = guess(heads, ['collection', 'كولكشن', 'كوليكشن', 'brand', 'براند', 'line']);
  const gG = guess(heads, ['gender', 'جنس', 'النوع', 'نوع', 'sex', 'category']);
  const gM = guess(heads, ['model', 'موديل', 'sku', 'code', 'كود', 'style']);
  const gQ = guess(heads, ['qr', 'barcode', 'باركود', 'url', 'link', 'لينك']);
  const t = T();
  const prev = `<table class="prev"><tr>${heads.map(h => `<th>${esc(h)}</th>`).join('')}</tr>${data.slice(0, 4).map(r => `<tr>${heads.map((_, i) => `<td>${esc(r[i])}</td>`).join('')}</tr>`).join('')}</table>`;
  const m = modal(`<div class="sb"><b>ربط الأعمدة</b> <span class="small">(${data.length} صف)</span>
   <div style="overflow:auto;margin:8px 0">${prev}</div>
   <div class="row"><div class="fld"><label>الكولكشن (BLC / 30S / OC)</label><select id="mC">${opt(gC)}</select></div><div class="fld"><label>النوع (MEN / WOMEN / UNISEX)</label><select id="mG">${opt(gG)}</select></div></div>
   <div class="row"><div class="fld"><label>رقم الموديل</label><select id="mM">${opt(gM)}</select></div><div class="fld"><label>محتوى الـQR (اختياري)</label><select id="mQ">${opt(gQ)}</select></div></div>
   <div class="row"><div class="fld"><label>عدد الموديلات في المربع</label><input type="number" id="mN" min="1" value="${t.blocks[0] ? t.blocks[0].items.length : 3}"></div><div class="fld"><label>شكل الصفحة</label><input type="text" disabled value="نفس إعدادات التاب الحالي (${t.cols}×${t.rows})"></div></div>
   <div class="fld"><label><input type="checkbox" id="mR" checked> استبدال كل التابات الحالية (لو شلتها هتتضاف تابات جديدة)</label></div>
   <p class="small">هيتعمل تاب لكل كولكشن + نوع، مترتّب تصاعدي، ولو الموديلات أكتر من صفحة هيتعمل أكتر من تاب.</p>
   <div class="row"><button class="btn pri" id="mGo">إنشاء الصفحات ✨</button><button class="btn" id="mX">إلغاء</button></div></div>`);
  m.querySelector('#mX').onclick = closeModal;
  m.querySelector('#mGo').onclick = async () => {
    const ci = +m.querySelector('#mC').value, gi = +m.querySelector('#mG').value, mi = +m.querySelector('#mM').value, qi = +m.querySelector('#mQ').value;
    const per = Math.max(1, parseInt(m.querySelector('#mN').value) || 3), replace = m.querySelector('#mR').checked;
    if (mi < 0) return toast('لازم تختار عمود رقم الموديل');
    if (replace && !(await ask('هيتمسح كل اللي في التابات الحالية ويتعمل جديد من الشيت. تمام؟', 'تمام', true))) return;
    const tabs = buildFromRows(IMP.data, ci, gi, mi, qi, per, T());
    if (!tabs.length) return toast('مفيش موديلات');
    if (replace) { S.tabs = tabs; cur = 0; } else { S.tabs.push(...tabs); cur = S.tabs.length - tabs.length; }
    sel = null; closeModal(); changed(); toast(`اتعمل ${tabs.length} تاب ✓`);
  };
}
function buildFromRows(data, ci, gi, mi, qi, per, tpl) {
  const groups = new Map();
  data.forEach(r => {
    const model = String(r[mi] ?? '').trim(); if (!model) return;
    const col = ci >= 0 ? String(r[ci] ?? '').trim() : '', gen = gi >= 0 ? String(r[gi] ?? '').trim() : '';
    const k = col + '\u0001' + gen; if (!groups.has(k)) groups.set(k, {col, gen, items: []});
    groups.get(k).items.push({model, qr: qi >= 0 ? String(r[qi] ?? '').trim() : ''});
  });
  const keys = [...groups.keys()].sort((a, b) => ncmp(a, b));
  const out = [];
  keys.forEach(k => {
    const g = groups.get(k); g.items.sort((a, b) => ncmp(a.model, b.model));
    const blocks = []; for (let i = 0; i < g.items.length; i += per) blocks.push(g.items.slice(i, i + per));
    const perPage = tpl.cols * tpl.rows, pages = Math.ceil(blocks.length / perPage);
    for (let p = 0; p < pages; p++) {
      const t = JSON.parse(JSON.stringify(tpl)); t.id = uid();
      t.name = [g.col, g.gen].filter(Boolean).join(' ') || 'صفحة'; t.col = g.col.toUpperCase() || 'أخرى'; t.gen = normGen(g.gen) || 'عام';
      const tc = textCol(t), qc = t.colT.indexOf('qr');
      t.blocks = blocks.slice(p * perPage, (p + 1) * perPage).map((items, j) => {
        const b = emptyBlock(t, 0);
        b.head = t.colT.map((_, c) => c === 0 ? g.col : c === lateIdx(t) ? String(p * perPage + j + 1) : c === t.colT.length - 1 ? g.gen : '');
        if (t.colT.length === 2) b.head = [g.col + ' ' + (p * perPage + j + 1), g.gen];
        items.forEach(x => { const it = {t: t.colT.map(() => '')}; if (tc >= 0) it.t[tc] = x.model; if (qc >= 0 && x.qr) it.t[qc] = x.qr; b.items.push(it); });
        while (b.items.length < per) b.items.push({t: t.colT.map(() => '')});
        return b;
      });
      ensureBlocks(t); t.blocks.forEach(b => { while (b.items.length < per) b.items.push({t: t.colT.map(() => '')}); });
      out.push(t);
    }
  });
  return out;
}

/* ---------- backup ---------- */
function openBackup() {
  const m = modal(`<div class="sb"><b>نسخة احتياطية</b><p class="small" style="font-size:13.5px">نزّل ملف فيه كل التابات والصور، وتقدر ترجّعه في أي وقت.</p><div class="row"><button class="btn pri" id="bkD">تنزيل النسخة 💾</button><button class="btn" id="bkU">استرجاع من ملف 📂</button><button class="btn" id="bkX">إغلاق</button></div></div>`);
  m.querySelector('#bkX').onclick = closeModal;
  m.querySelector('#bkD').onclick = async () => { closeModal(); await saveFile(`stickers-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(S)); };
  m.querySelector('#bkU').onclick = () => { closeModal(); $('#fJson').value = ''; $('#fJson').click(); };
}
$('#fJson').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const s = JSON.parse(await f.text()); if (!s.tabs) throw 0; if (!(await ask('استرجاع النسخة دي هيستبدل كل اللي موجود. تمام؟', 'استرجاع', true))) return; S = s; S.images = S.images || {}; S.skus = S.skus || {}; S.tabs.forEach(migrate); cur = 0; sel = null; changed(); toast('اترجعت ✓'); } catch (er) { toast('الملف ده مش نسخة صحيحة'); }
};
async function saveFile(name, data) {
  if (DL) {
    try { const r = await DL.save({filename: name, data}); if (r.status === 'saved') toast('اتنزّل ✓'); return true; }
    catch (e) { if (e && e.code === 'declined') return false; if (e && e.code === 'rate_limited') { toast('استنى ثانية وجرّب تاني'); return false; } }
  }
  try { const u = URL.createObjectURL(data instanceof Blob ? data : new Blob([data])); const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); return true; } catch (e) { toast('التنزيل مش متاح هنا'); return false; }
}

/* ---------- PDF ---------- */
const IN_CLAUDE = !!(window.claude && claude.use);
function openPrint() {
  const t = T();
  const sc = [['cur', `الصفحة دي بس (${tabLabel(t)})`], ['gen', `كل صفحات ${t.col} ${t.gen} (${pagesOf(t.col, t.gen).length})`], ['col', `كل صفحات ${t.col} (${S.tabs.filter(x => x.col === t.col).length})`], ['all', `كل الصفحات (${S.tabs.length})`], ['pick', 'اختيار صفحات معيّنة']];
  const m = modal(`<div class="sb"><b>طباعة 🖨️</b>
   <div class="grp" style="border:none;margin-top:6px;padding-top:0"><h4>اطبع إيه</h4>${sc.map(([k, v], i) => `<label style="display:block;padding:4px 0"><input type="radio" name="ps" value="${k}" ${i === 0 ? 'checked' : ''}> <span style="unicode-bidi:plaintext">${esc(v)}</span></label>`).join('')}<div id="pk"></div></div>
   <div class="row" style="margin-top:6px">${IN_CLAUDE ? '' : '<button class="btn pri" id="pPr">طباعة على الطابعة 🖨️</button>'}<button class="btn ${IN_CLAUDE ? 'pri' : ''}" id="pPdf">حفظ PDF 📄</button><button class="btn" id="pX">إلغاء</button></div>
   <p class="small" style="margin-top:10px">${IN_CLAUDE ? 'الطباعة المباشرة بتشتغل من رابط GitHub — هنا متاح حفظ PDF بس.' : 'في شاشة الطباعة اختار طابعة HP LaserJet مرة واحدة والمتصفح هيفتكرها بعد كده. خلّي الـScale على Default أو 100% مش Fit to paper عشان المقاسات تطلع مظبوطة.'}</p></div>`);
  const pick = () => { const v = m.querySelector('input[name=ps]:checked').value; m.querySelector('#pk').innerHTML = v === 'pick' ? `<div style="margin:6px 18px 0">${S.tabs.map((x, i) => `<label style="display:block;padding:3px 0"><input type="checkbox" value="${i}" ${i === cur ? 'checked' : ''}> <span style="direction:ltr;display:inline-block">${esc(tabLabel(x))}</span></label>`).join('')}</div>` : ''; };
  m.querySelectorAll('input[name=ps]').forEach(r => r.onchange = pick);
  const chosen = () => { const v = m.querySelector('input[name=ps]:checked').value; return v === 'cur' ? [T()] : v === 'gen' ? pagesOf(T().col, T().gen).map(i => S.tabs[i]) : v === 'col' ? S.tabs.filter(x => x.col === T().col) : v === 'all' ? S.tabs : [...m.querySelectorAll('#pk input:checked')].map(i => S.tabs[+i.value]); };
  m.querySelector('#pX').onclick = closeModal;
  m.querySelector('#pPdf').onclick = async () => { const tabs = chosen(); if (!tabs.length) return toast('اختار صفحة واحدة على الأقل'); closeModal(); await exportPdf(tabs); };
  const pr = m.querySelector('#pPr'); if (pr) pr.onclick = () => { const tabs = chosen(); if (!tabs.length) return toast('اختار صفحة واحدة على الأقل'); closeModal(); printDirect(tabs); };
}
$('#bPdf').onclick = openPrint;
async function exportPdf(tabs) {
  toast('بجهّز الـPDF…');
  try {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const {jsPDF} = window.jspdf; let doc;
    tabs.forEach((tab, i) => { const o = tab.orient === 'l' ? 'landscape' : 'portrait'; if (!i) doc = new jsPDF({orientation: o, unit: 'mm', format: 'a4'}); else doc.addPage('a4', o); drawTab(doc, tab); });
    const name = (tabs.length === 1 ? 'sticker-' + tabLabel(tabs[0]) : 'stickers-' + [...new Set(tabs.map(t => t.col))].join('-') + '-' + tabs.length + 'p').replace(/[\\/:*?"<>|]+/g, '-') + '.pdf';
    const ok = await saveFile(name, doc.output('blob'));
    if (!ok && !DL) printFallback(tabs);
  } catch (e) { console.error(e); toast('مقدرتش أعمل PDF — هفتح الطباعة العادية'); printFallback(tabs); }
}
function drawTab(doc, tab) {
  ensureBlocks(tab); const L = layout(tab);
  if (tab.cut) {
    const xs = new Set(), ys = new Set();
    L.boxes.forEach((b, i) => { if (tab.blocks[i].hidden) return; xs.add(+b.x.toFixed(2)); xs.add(+(b.x + b.w).toFixed(2)); ys.add(+b.y.toFixed(2)); ys.add(+(b.y + b.h).toFixed(2)); });
    doc.setDrawColor(200); doc.setLineWidth(0.2);
    xs.forEach(x => doc.line(x, 3, x, L.H - 3)); ys.forEach(y => doc.line(3, y, L.W - 3, y));
  }
  L.boxes.forEach((bx, i) => {
    const b = tab.blocks[i]; if (b.hidden) return;
    const xs = [bx.x]; tab.colW.forEach(w => xs.push(xs[xs.length - 1] + w));
    doc.setDrawColor(0);
    doc.setLineWidth(0.3);
    for (let c = 1; c < tab.colT.length; c++) doc.line(xs[c], bx.y, xs[c], bx.y + bx.h);
    for (let r = 1; r < b.items.length; r++) { const y = bx.y + tab.headH + r * tab.rowH; doc.line(bx.x, y, bx.x + bx.w, y); }
    doc.setLineWidth(0.5);
    doc.line(bx.x, bx.y + tab.headH, bx.x + bx.w, bx.y + tab.headH);
    doc.rect(bx.x, bx.y, bx.w, bx.h);
    doc.setFont('helvetica', 'bold'); doc.setTextColor(0);
    doc.setFontSize(tab.headFs);
    tab.colT.forEach((t, c) => { const s = headText(tab, b, c); if (s) doc.text(s, xs[c] + tab.colW[c] / 2, bx.y + tab.headH / 2, {align: 'center', baseline: 'middle'}); });
    b.items.forEach((it, r) => {
      const y0 = bx.y + tab.headH + r * tab.rowH, h = tab.rowH;
      tab.colT.forEach((t, c) => {
        const x0 = xs[c], w = tab.colW[c], p = tab.pad;
        if (t === 'text' && it.t[c]) { doc.setFontSize(tab.textFs); doc.text(String(it.t[c]), x0 + w / 2, y0 + h / 2, {align: 'center', baseline: 'middle'}); }
        if (t === 'qr') {
          const m = qrMods(qrValue(tab, it, c)); if (!m) return;
          const s = Math.max(4, Math.min(w, h) - 2 * p), u = s / m.n, qx = x0 + (w - s) / 2, qy = y0 + (h - s) / 2;
          doc.setFillColor(0);
          m.g.forEach((row, rr) => { let cc = 0; while (cc < m.n) { if (row[cc]) { let e = cc; while (e < m.n && row[e]) e++; doc.rect(qx + cc * u, qy + rr * u, (e - cc) * u + 0.01, u + 0.01, 'F'); cc = e; } else cc++; } });
        }
        if (t === 'image') {
          const im = imgFor(tab, it, c); if (!im) return;
          const bw = w - 2 * p, bh = h - 2 * p, sc = Math.min(bw / im.w, bh / im.h), iw = im.w * sc, ih = im.h * sc;
          doc.addImage(im.d, 'JPEG', x0 + (w - iw) / 2, y0 + (h - ih) / 2, iw, ih, 'k' + hashStr(im.d), 'FAST');
        }
      });
    });
  });
}
function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i += 7) h = (h * 31 + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36) + s.length; }
function printDirect(tabs) {
  const o = tabs[0].orient === 'l' ? 'landscape' : 'portrait';
  $('#pageStyle').textContent = `@page{size:A4 ${o};margin:0}`;
  const keep = sel; sel = null;
  $('#printRoot').innerHTML = tabs.map(t => pageHTML(t, false)).join('');
  sel = keep;
  const imgs = [...$('#printRoot').querySelectorAll('img')];
  Promise.all(imgs.map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; }))).then(() => setTimeout(() => {
    try { window.print(); } catch (e) { toast('الطباعة مش متاحة هنا — استخدم حفظ PDF'); }
  }, 60));
}
const printFallback = printDirect;
window.addEventListener('afterprint', () => { $('#printRoot').innerHTML = ''; });

/* ---------- boot ---------- */
async function boot() {
  let fileS = null, localS = null;
  try { const r = await fetch('data/state.json', {cache: 'no-store'}); if (r.ok) fileS = await r.json(); } catch (e) {}
  try { const l = localStorage.getItem(LS); if (l) localS = JSON.parse(l); } catch (e) {}
  S = [fileS, localS].filter(x => x && x.tabs && x.tabs.length).sort((a, b) => (b.updated || 0) - (a.updated || 0))[0] || demo();
  S.images = S.images || {}; S.skus = S.skus || {}; S.qrTpl = S.qrTpl || '{model}'; S.tabs.forEach(migrate); { const o = []; colList().forEach(c => genList(c).forEach(g => pagesOf(c, g).forEach(i => o.push(S.tabs[i])))); S.tabs = o; }
  render(true);
  setStatus('جاهز', 'ok');
  if (window.claude && claude.use) {
    claude.use('artifact').then(a => { ART = a; if (!a) setStatus('محفوظ على الجهاز بس', 'warn'); else if (localS && (!fileS || (localS.updated || 0) > (fileS.updated || 0))) setStatus('فيه تعديلات هتتحفظ مع أول تغيير', 'warn'); });
    claude.use('downloads').then(d => { DL = d; });
  }
}
boot();
